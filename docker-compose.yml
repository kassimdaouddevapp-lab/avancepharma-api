version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: avancepharma_postgres
    environment:
      POSTGRES_DB: avancepharma
      POSTGRES_USER: avancepharma_user
      POSTGRES_PASSWORD: avancepharma_pass
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avancepharma_user -d avancepharma"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: avancepharma_redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data: